name: Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend
        run: docker build -f docker/production/Dockerfile-frontend -t bjeyflow/web:ci .
      - name: Build backend
        run: docker build -f docker/production/Dockerfile-backend -t bjeyflow/backend:ci .
      - name: Check Django production configuration
        run: >-
          docker run --rm --entrypoint python
          -e DEBUG=False
          -e DJANGO_SECRET_KEY=ci-only-configuration-check-not-a-production-secret-key
          bjeyflow/backend:ci manage.py check --deploy

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Deploy exact commit
        run: |
          set -o pipefail
          git archive --format=tar HEAD | gzip | ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            root@94.184.25.40 "deploy $GITHUB_SHA"
      - name: Verify public health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://bjeyflow.space/healthz/
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
