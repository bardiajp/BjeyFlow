[tool.black]
line-length = 88
target-version = ['py311']
skip-string-normalization = true
exclude = '''
(
  /(
      \.git
    | \.venv
    | migrations
    | __pycache__
  )/
)
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["users/tests"]
python_files = ["test_*.py"]
