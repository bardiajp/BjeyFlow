x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      <<: *db-env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    build:
      context: .
      dockerfile: docker/Dockerfile-backend
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8100}:8000"

  frontend:
    depends_on:
      - backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile-frontend
    environment:
      VITE_HOST: ${HOST:-localhost}
      VITE_BACKEND_PORT: ${BACKEND_PORT:-8100}
      VITE_USE_POLLING: "true"
      VITE_HMR_CLIENT_PORT: ${FRONTEND_PORT:-5174}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5173"

volumes:
  postgres_data:
