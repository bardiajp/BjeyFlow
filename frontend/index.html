<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#023047" />
        <meta name="description" content="A calmer space for your projects and tasks." />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="BjeyFlow" />
        <title>BjeyFlow</title>
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <script src="/app-loading.js"></script>
        <link rel="preload" href="/images/ball.svg" as="image" type="image/svg+xml" />
        <link rel="stylesheet" href="/app-loading.css" />
    </head>
    <body>
        <div id="root"></div>
        <section
            id="app-loading"
            class="app-loading"
            role="status"
            aria-live="polite"
            aria-label="Loading your workspace"
        >
            <div class="app-loading-art" aria-hidden="true">
                <span class="app-loading-glow"></span>
                <img class="app-loading-orb" src="/images/ball.svg" alt="" width="88" height="88" />
                <svg class="app-loading-face" viewBox="0 0 88 88">
                    <g class="app-loading-eyes">
                        <ellipse cx="34" cy="46" rx="2.5" ry="3.5" />
                        <ellipse cx="54" cy="46" rx="2.5" ry="3.5" />
                    </g>
                    <path d="M39 57Q44 61 49 57" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </div>
            <div class="app-loading-sea" aria-hidden="true">
                <div class="app-loading-wave-travel">
                    <svg class="app-loading-water" viewBox="0 0 300 120" preserveAspectRatio="none">
                        <path class="app-loading-wave-back" d="M0 120C60 120 80 78 145 78S235 120 300 120Z" />
                        <path class="app-loading-wave-front" d="M0 120C70 120 95 30 150 30S230 120 300 120Z" />
                    </svg>
                </div>
            </div>
            <h1 class="app-loading-brand">BjeyFlow<span class="app-loading-dot" aria-hidden="true"></span></h1>
            <p class="app-loading-message">Getting your workspace ready</p>
            <p class="app-loading-footer">Less noise. More focus.</p>
        </section>
        <noscript
            ><section class="app-loading">
                <h1 class="app-loading-brand">
                    JavaScript is needed
                </h1>
                <p class="app-loading-message">Enable JavaScript to open your workspace.</p>
            </section></noscript
        >
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
